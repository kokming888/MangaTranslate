<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="iconTitle" role="img">
    <title id="iconTitle">Futuristic 'T' Icon</title>
    
    <!-- Group element ensures all components scale together -->
    <g transform="translate(50, 50)">
        
        <!-- Base shape (The T structure) -->
        <!-- Primary bar (Vertical bar) -->
        <rect x="-8" y="-40" width="16" height="80" rx="4" style="fill:none;stroke-width:2;stroke:url(#glowGradient)"/>
        
        <!-- Crossbar (Horizontal bar) -->
        <rect x="-30" y="-10" width="60" height="16" rx="3" style="fill:none;stroke-width:2;stroke:url(#glowGradient)"/>

        <!-- Glitch/Circuit detail (adds the futuristic flair) -->
        <path d="M-20 -20 L-18 -22 L-20 -24" stroke-width="1" stroke="#b9f2ff" fill="none"/>
        <path d="M18 -20 L20 -22 L18 -24" stroke-width="1" stroke="#b9f2ff" fill="none"/>

    </g>
    
    <!-- Gradient definition for the Neon Glow effect -->
    <defs>
        <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(0, 255, 255, 0.7)"/>
            <stop offset="100%" style="stop-color:rgba(0, 150, 255, 0.4)"/>
        </linearGradient>
    </defs>
</svg>